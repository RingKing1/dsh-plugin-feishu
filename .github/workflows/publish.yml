name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      - run: npm ci

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner ships 10.x.
      - name: Upgrade npm
        run: npm install -g npm@11

      # prepublishOnly runs the test suite, so a failing test blocks the release.
      # No token: the OIDC id-token above authenticates against the Trusted Publisher
      # configured for this repo on npmjs.com.
      - name: Publish
        run: npm publish --provenance --access public
