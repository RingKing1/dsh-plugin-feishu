# dsh-plugin-feishu 的 bundle 补丁层（由 package.json 的 dsh.bundle.patch 引用）。
# 用法：dsh plugin --profile <名字> add <本包路径>，然后 dsh --profile <名字> 启动。
# 这一层会被叠加到 dsh-base 之上，按【包名】引用插件模块，
# Node 才能从 profile 的 node_modules 里解析到本包。
#
# 行 id 是配置命名空间（插件页 / 日志里用它标识这一行）。
- insert:
    - id: feishu
      name: 'dsh-plugin-feishu'
      config:
        # 飞书自建应用的凭证。留空时也可以由环境变量提供：
        #   DSH_FEISHU_APP_ID / DSH_FEISHU_APP_SECRET
        appId: ''
        appSecret: ''
        # 国际版 Lark 用 https://open.larksuite.com
        domain: 'https://open.feishu.cn'
        # 新建会话的默认工作目录；留空 = dsh 进程的当前目录
        workdir: ''
        # 允许使用机器人的飞书 open_id 白名单；留空 = 不限制（自建自用场景）
        allowedOpenIds: []
        # 群聊里是否必须 @ 机器人才响应
        requireMentionInGroup: true
        # 流式刷新卡片的最小间隔（毫秒），飞书侧有频率限制，不要低于 200
        streamIntervalMs: 700
        # 单张卡片正文上限，超出截断并提示
        maxReplyChars: 8000
        # 工具授权是否搬到飞书：true = 发「允许一次 / 拒绝」卡片；false = 只在网页弹
        approvalInFeishu: true
        # 授权等多久（毫秒）：超时后请求转回 DSH 网页，不会把这一轮一直挂住
        approvalTimeoutMs: 600000
        # 会话映射落盘位置；留空 = ~/.dsh/feishu/state.json
        statePath: ''
        debug: false
